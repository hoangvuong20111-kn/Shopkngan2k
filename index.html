<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffb6e0"><title>Vương (E Bé Ngân) — Gaming Profile</title>
<style>
:root{--pink:#ff83d0;--ink:#fff;--glass:rgba(31,12,61,.74)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:#180c35;color:var(--ink)}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden;padding:0 14px 28px;background:linear-gradient(180deg,#210c43,#180c35)}
.banner{display:block;width:min(100%,1100px);height:auto;max-height:360px;object-fit:cover;object-position:center;border-radius:0 0 22px 22px;box-shadow:0 8px 30px #ff71d533}
.profile{margin:24px auto 0;position:relative}
.profile{width:min(100%,360px);padding:24px 20px 19px;text-align:center;border:1px solid #ffffff80;border-radius:24px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 16px 55px #0d002d70,0 0 25px #ff6eda33;animation:rise .55s ease both}
.avatar-ring{width:102px;height:102px;margin:0 auto 13px;padding:4px;border-radius:50%;background:linear-gradient(135deg,#ff7ed1,#b98cff,#fff0fb);box-shadow:0 0 22px #ff80db66}
.avatar{width:100%;height:100%;display:block;object-fit:cover;object-position:center 28%;border:3px solid white;border-radius:50%}
.tag{display:inline-block;padding:6px 11px;border-radius:99px;background:#ffb3e92b;border:1px solid #ffc9f580;color:#ffe2f6;font-size:10px;font-weight:800;letter-spacing:1.4px}
h1{margin:12px 0 6px;font-size:clamp(24px,6vw,30px);line-height:1.2;letter-spacing:-.6px;text-shadow:0 2px 16px #ff55c766}h1 span{color:#ffb8e8}
.bio{margin:0 auto 18px;color:#f7e9ff;font-size:13px;line-height:1.65}
.links{display:grid;gap:10px}.link{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid #ffc9f55c;border-radius:14px;background:#ffffff1a;color:#fff;text-decoration:none;font-size:13px;font-weight:750;transition:transform .2s,background .2s}
.link:hover{transform:translateY(-2px);background:#ff91db38}.left{display:flex;align-items:center;gap:11px}
.icon{display:grid;place-items:center;width:33px;height:33px;border-radius:10px;background:linear-gradient(135deg,#ff83d0,#9b72ff);font-size:16px;font-weight:900}
.arrow{color:#ffc6ee;font-size:18px}.foot{margin:16px 0 0;color:#f4dff5;font-size:10px;opacity:.85}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:520px){.profile{width:min(100%,345px);padding:21px 16px 18px}.banner{width:100%;max-height:none;border-radius:0 0 18px 18px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>
